<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>PRUMDA Learning Trip • AI Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --pru-red: #ed1b2e;
        --pru-red-dark: #c8102e;
        --pru-bg: #f4f6f9;
        --pru-surface: #ffffff;
        --pru-slate: #0f172a;
      }
      body {
        background-color: #f4f6f9;
        color: #0f172a;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .font-display {
        font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
        letter-spacing: -0.015em;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#475569;font-size:14px;font-weight:600;">
        🇲🇾 Loading PRUMDA Learning Trip • AI Arena...
      </div>
    </div>

    <!-- 1. Shared Languages & Portrait Card Compositor -->
    <script src="/static/i18n.js"></script>

    <!-- 2. Modular Challenge Views (Owned by Colleagues 1, 2 & 3) -->
    <script type="text/babel" src="/static/challenge1.js"></script>
    <script type="text/babel" src="/static/challenge2.js"></script>
    <script type="text/babel" src="/static/challenge3.js"></script>

    <!-- 3. Stage Showcases (15:05 Canvas + 15:15 Live Coach) & Submission Card Renderer -->
    <script type="text/babel" src="/static/showcases.js"></script>

    <!-- 4. Core Presenter, Participant & Developer Sandbox Router -->
    <script type="text/babel" src="/static/arena_app.js"></script>
  </body>
</html>
