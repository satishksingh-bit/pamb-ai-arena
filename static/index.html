<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>PRUMDA Learning Trip • AI Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --pru-red: #ed1b2e;
        --pru-red-dark: #c8102e;
        --pru-bg: #f4f6f9;
        --pru-surface: #ffffff;
        --pru-slate: #0f172a;
      }
      @media (max-width: 639px) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      body {
        background-color: #f4f6f9;
        color: #0f172a;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .font-display {
        font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
        letter-spacing: -0.015em;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Universal Click-to-Zoom affordance on Arena images */
      img:not([data-no-zoom="true"]) {
        cursor: zoom-in;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      button img:not([data-zoomable="true"]),
      a img:not([data-zoomable="true"]) {
        cursor: pointer;
      }
      #arena-image-zoom-lightbox {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(8, 12, 22, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        justify-content: space-between;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #arena-image-zoom-lightbox.is-open {
        display: flex;
      }
      .arena-zoom-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 800;
        color: #f8fafc;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.35);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      }
      .arena-zoom-btn:hover {
        background: rgba(237, 27, 46, 0.9);
        border-color: #ed1b2e;
      }
      .arena-zoom-btn:active {
        transform: scale(0.96);
      }
      .arena-zoom-btn.is-active {
        background: #ed1b2e;
        border-color: #ed1b2e;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#475569;font-size:14px;font-weight:600;">
        🇲🇾 Loading PRUMDA Learning Trip • AI Arena...
      </div>
    </div>

    <!-- 1. Shared Languages & Portrait Card Compositor -->
    <script src="/static/i18n.js"></script>

    <!-- 2. Modular Challenge Views (Owned by Colleagues 1, 2 & 3) -->
    <script type="text/babel" src="/static/challenge1.js"></script>
    <script type="text/babel" src="/static/challenge2.js"></script>
    <script type="text/babel" src="/static/challenge3.js"></script>

    <!-- 3. Stage Showcases (15:05 Canvas + 15:15 Live Coach) & Submission Card Renderer -->
    <script type="text/babel" src="/static/showcases.js"></script>

    <!-- 4. Core Presenter, Participant & Developer Sandbox Router -->
    <script type="text/babel" src="/static/arena_app.js"></script>

    <!-- 5. Universal Zero-Dependency Click-to-Zoom Image Lightbox -->
    <div id="arena-image-zoom-lightbox" role="dialog" aria-modal="true" aria-label="Image Zoom Viewer">
      <!-- Top Bar: Caption + Save + Close -->
      <div
        id="arena-zoom-topbar"
        style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px, env(safe-area-inset-top)) 16px 12px 16px;touch-action:manipulation;background:linear-gradient(to bottom,rgba(8,12,22,0.88),rgba(8,12,22,0));z-index:2;"
      >
        <div
          id="arena-zoom-caption"
          style="color:#f1f5f9;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58vw;"
        >
          Image Preview
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <button type="button" id="arena-zoom-save" class="arena-zoom-btn" title="Download image">
            ⬇️ Save
          </button>
          <button
            type="button"
            id="arena-zoom-close"
            class="arena-zoom-btn"
            style="background:#ed1b2e;border-color:#ed1b2e;"
            title="Close (Esc)"
          >
            ✕ Close
          </button>
        </div>
      </div>

      <!-- Center Viewport: Drag / Pinch / Wheel / Double-Tap Zoom Stage -->
      <div
        id="arena-zoom-stage"
        style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px 16px;"
      >
        <img
          id="arena-zoom-img"
          data-no-zoom="true"
          src=""
          alt="Zoomed preview"
          draggable="false"
          style="max-width:92vw;max-height:78vh;object-fit:contain;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,0.65);transform-origin:center center;will-change:transform;cursor:grab;user-select:none;-webkit-user-drag:none;"
        />
      </div>

      <!-- Bottom Floating Zoom Toolbar -->
      <div
        id="arena-zoom-bottombar"
        style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px max(16px, env(safe-area-inset-bottom)) 16px;touch-action:manipulation;background:linear-gradient(to top,rgba(8,12,22,0.9),rgba(8,12,22,0));z-index:2;"
      >
        <div
          style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:rgba(15,23,42,0.92);border:1px solid rgba(148,163,184,0.3);padding:6px 10px;border-radius:9999px;box-shadow:0 12px 30px rgba(0,0,0,0.5);"
        >
          <button type="button" id="arena-zoom-out" class="arena-zoom-btn" title="Zoom out">−</button>
          <button type="button" id="arena-zoom-reset" class="arena-zoom-btn is-active" title="Reset to 100%">100%</button>
          <button type="button" id="arena-zoom-in" class="arena-zoom-btn" title="Zoom in">+</button>
          <span style="width:1px;height:18px;background:rgba(148,163,184,0.3);margin:0 2px;"></span>
          <button type="button" data-zoom-preset="1" class="arena-zoom-btn is-active">1×</button>
          <button type="button" data-zoom-preset="2" class="arena-zoom-btn">2×</button>
          <button type="button" data-zoom-preset="3" class="arena-zoom-btn">3×</button>
        </div>
        <div style="color:#94a3b8;font-size:11px;font-weight:600;text-align:center;">
          Pinch, scroll, or double-tap to zoom • Drag to pan • Tap backdrop or Esc to close
        </div>
      </div>
    </div>

    <script>
      (function () {
        var overlay = document.getElementById("arena-image-zoom-lightbox");
        var stage = document.getElementById("arena-zoom-stage");
        var zoomImg = document.getElementById("arena-zoom-img");
        var captionEl = document.getElementById("arena-zoom-caption");
        var btnClose = document.getElementById("arena-zoom-close");
        var btnSave = document.getElementById("arena-zoom-save");
        var btnIn = document.getElementById("arena-zoom-in");
        var btnOut = document.getElementById("arena-zoom-out");
        var btnReset = document.getElementById("arena-zoom-reset");
        var presetBtns = overlay.querySelectorAll("[data-zoom-preset]");

        var state = {
          open: false,
          scale: 1,
          tx: 0,
          ty: 0,
          dragging: false,
          dragMoved: false,
          startX: 0,
          startY: 0,
          originTx: 0,
          originTy: 0,
          pinching: false,
          initialPinchDist: 0,
          initialPinchScale: 1,
          lastTapTs: 0,
          prevBodyOverflow: "",
        };

        var MIN_SCALE = 1;
        var MAX_SCALE = 4.5;

        function clamp(val, min, max) {
          return Math.max(min, Math.min(max, val));
        }

        function clampPan() {
          if (state.scale <= 1.01) {
            state.tx = 0;
            state.ty = 0;
            return;
          }
          var rect = zoomImg.getBoundingClientRect();
          var baseW = rect.width / state.scale || window.innerWidth * 0.8;
          var baseH = rect.height / state.scale || window.innerHeight * 0.7;
          var maxX = Math.max(0, (baseW * state.scale - window.innerWidth * 0.55) / 2);
          var maxY = Math.max(0, (baseH * state.scale - window.innerHeight * 0.55) / 2);
          state.tx = clamp(state.tx, -maxX, maxX);
          state.ty = clamp(state.ty, -maxY, maxY);
        }

        function applyTransform(smooth) {
          clampPan();
          zoomImg.style.transition = smooth ? "transform 0.18s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
          zoomImg.style.transform =
            "translate3d(" + state.tx.toFixed(1) + "px, " + state.ty.toFixed(1) + "px, 0) scale(" + state.scale.toFixed(3) + ")";
          zoomImg.style.cursor = state.scale > 1.02 ? (state.dragging ? "grabbing" : "grab") : "zoom-in";
          btnReset.textContent = Math.round(state.scale * 100) + "%";
          presetBtns.forEach(function (b) {
            var target = parseFloat(b.getAttribute("data-zoom-preset") || "1");
            if (Math.abs(state.scale - target) < 0.12) {
              b.classList.add("is-active");
            } else {
              b.classList.remove("is-active");
            }
          });
          if (Math.abs(state.scale - 1) < 0.05) {
            btnReset.classList.add("is-active");
          } else {
            btnReset.classList.remove("is-active");
          }
        }

        function setZoom(nextScale, smooth) {
          state.scale = clamp(nextScale, MIN_SCALE, MAX_SCALE);
          if (state.scale <= 1.02) {
            state.tx = 0;
            state.ty = 0;
          }
          applyTransform(Boolean(smooth));
        }

        function showArenaSaveToast(msg) {
          var existing = document.getElementById("arena-save-toast");
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }
          var toast = document.createElement("div");
          toast.id = "arena-save-toast";
          toast.textContent = msg;
          toast.style.cssText =
            "position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10050;" +
            "background:rgba(15,23,42,0.96);color:#f8fafc;border:1px solid rgba(237,27,46,0.75);border-radius:9999px;" +
            "padding:10px 16px;font-size:12px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,0.45);" +
            "max-width:90vw;text-align:center;pointer-events:none;transition:opacity 0.2s ease;";
          document.body.appendChild(toast);
          setTimeout(function () {
            toast.style.opacity = "0";
            setTimeout(function () {
              if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 240);
          }, 2800);
        }

        window.saveArenaMediaMobileSafe = async function (src, baseName) {
          if (!src) return;
          var safeBase = String(baseName || "prumda-ai-image-" + Date.now()).replace(/\.(png|jpe?g|webp)$/i, "");
          var ua = (navigator && navigator.userAgent) || "";
          var isInAppWebView = /MicroMessenger|WhatsApp/i.test(ua);
          if (isInAppWebView && !(navigator && navigator.canShare)) {
            showArenaSaveToast("📱 Tip: Long-press the image directly to Save to Photos");
          }
          try {
            var res = await fetch(src);
            var blob = await res.blob();
            var ext = blob.type && blob.type.indexOf("png") !== -1 ? "png" : "jpg";
            var filename = safeBase + "." + ext;
            var mime = blob.type || (ext === "png" ? "image/png" : "image/jpeg");

            if (
              navigator &&
              navigator.maxTouchPoints > 0 &&
              typeof File === "function" &&
              typeof navigator.canShare === "function" &&
              typeof navigator.share === "function"
            ) {
              try {
                var file = new File([blob], filename, { type: mime });
                if (navigator.canShare({ files: [file] })) {
                  await navigator.share({ files: [file], title: filename });
                  return;
                }
              } catch (shareErr) {
                if (shareErr && shareErr.name === "AbortError") {
                  return;
                }
              }
            }

            if (isInAppWebView) {
              showArenaSaveToast("📱 Tip: Long-press the image directly to Save to Photos");
            }

            var blobUrl = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = blobUrl;
            a.download = filename;
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () {
              URL.revokeObjectURL(blobUrl);
            }, 30000);
          } catch (err) {
            var fallbackExt = src.indexOf("image/png") !== -1 ? "png" : "jpg";
            var aFallback = document.createElement("a");
            aFallback.href = src;
            aFallback.download = safeBase + "." + fallbackExt;
            aFallback.style.display = "none";
            document.body.appendChild(aFallback);
            aFallback.click();
            document.body.removeChild(aFallback);
          }
        };

        window.openArenaImageZoom = function (src, altText) {
          if (!src) return;
          state.open = true;
          state.scale = 1;
          state.tx = 0;
          state.ty = 0;
          state.dragMoved = false;
          state.dragging = false;
          state.pinching = false;
          zoomImg.src = src;
          var label = (altText && String(altText).trim()) || "Image Preview";
          zoomImg.alt = label;
          captionEl.textContent = "🔍 " + label;
          state.prevBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          overlay.classList.add("is-open");
          applyTransform(false);
        };

        window.closeArenaImageZoom = function () {
          if (!state.open) return;
          state.open = false;
          overlay.classList.remove("is-open");
          document.body.style.overflow = state.prevBodyOverflow || "";
          setTimeout(function () {
            if (!state.open) zoomImg.src = "";
          }, 150);
        };

        btnClose.addEventListener("click", function (e) {
          e.stopPropagation();
          window.closeArenaImageZoom();
        });

        btnIn.addEventListener("click", function (e) {
          e.stopPropagation();
          setZoom(state.scale + 0.5, true);
        });

        btnOut.addEventListener("click", function (e) {
          e.stopPropagation();
          setZoom(state.scale - 0.5, true);
        });

        btnReset.addEventListener("click", function (e) {
          e.stopPropagation();
          state.tx = 0;
          state.ty = 0;
          setZoom(1, true);
        });

        presetBtns.forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var target = parseFloat(btn.getAttribute("data-zoom-preset") || "1");
            if (target === 1) {
              state.tx = 0;
              state.ty = 0;
            }
            setZoom(target, true);
          });
        });

        btnSave.addEventListener("click", function (e) {
          e.stopPropagation();
          var src = zoomImg.src;
          if (!src) return;
          window.saveArenaMediaMobileSafe(src, "prumda-ai-image-" + Date.now());
        });

        // Escape key & +/- keyboard shortcuts
        document.addEventListener("keydown", function (e) {
          if (!state.open) return;
          if (e.key === "Escape") {
            e.preventDefault();
            window.closeArenaImageZoom();
          } else if (e.key === "+" || e.key === "=") {
            e.preventDefault();
            setZoom(state.scale + 0.5, true);
          } else if (e.key === "-" || e.key === "_") {
            e.preventDefault();
            setZoom(state.scale - 0.5, true);
          } else if (e.key === "0") {
            e.preventDefault();
            state.tx = 0;
            state.ty = 0;
            setZoom(1, true);
          }
        });

        // Backdrop click closes lightbox (unless user just dragged the image)
        stage.addEventListener("click", function (e) {
          if (state.dragMoved) {
            state.dragMoved = false;
            return;
          }
          if (e.target === stage) {
            window.closeArenaImageZoom();
          }
        });

        // Double-click on desktop toggles 1x <-> 2.2x
        zoomImg.addEventListener("dblclick", function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (state.scale > 1.15) {
            state.tx = 0;
            state.ty = 0;
            setZoom(1, true);
          } else {
            setZoom(2.2, true);
          }
        });

        // Desktop mouse wheel zoom
        stage.addEventListener(
          "wheel",
          function (e) {
            if (!state.open) return;
            e.preventDefault();
            var delta = e.deltaY < 0 ? 0.28 : -0.28;
            setZoom(state.scale + delta, false);
          },
          { passive: false }
        );

        // Desktop mouse drag panning
        zoomImg.addEventListener("mousedown", function (e) {
          if (!state.open || e.button !== 0) return;
          e.preventDefault();
          state.dragging = true;
          state.dragMoved = false;
          state.startX = e.clientX;
          state.startY = e.clientY;
          state.originTx = state.tx;
          state.originTy = state.ty;
          applyTransform(false);
        });

        window.addEventListener("mousemove", function (e) {
          if (!state.open || !state.dragging) return;
          var dx = e.clientX - state.startX;
          var dy = e.clientY - state.startY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
            state.dragMoved = true;
          }
          if (state.scale > 1.02) {
            state.tx = state.originTx + dx;
            state.ty = state.originTy + dy;
            applyTransform(false);
          }
        });

        window.addEventListener("mouseup", function () {
          if (!state.dragging) return;
          state.dragging = false;
          if (state.open) applyTransform(true);
        });

        // Mobile Touch: Pinch-to-Zoom + 1-Finger Pan + Double-Tap Toggle
        function getTouchDist(touches) {
          var dx = touches[0].clientX - touches[1].clientX;
          var dy = touches[0].clientY - touches[1].clientY;
          return Math.hypot(dx, dy);
        }

        stage.addEventListener(
          "touchstart",
          function (e) {
            if (!state.open) return;
            if (e.touches.length === 2) {
              e.preventDefault();
              state.pinching = true;
              state.dragging = false;
              state.initialPinchDist = getTouchDist(e.touches);
              state.initialPinchScale = state.scale;
            } else if (e.touches.length === 1) {
              var now = Date.now();
              if (e.target === zoomImg && now - state.lastTapTs < 280) {
                e.preventDefault();
                state.lastTapTs = 0;
                if (state.scale > 1.15) {
                  state.tx = 0;
                  state.ty = 0;
                  setZoom(1, true);
                } else {
                  setZoom(2.2, true);
                }
                return;
              }
              state.lastTapTs = now;
              state.dragging = true;
              state.dragMoved = false;
              state.startX = e.touches[0].clientX;
              state.startY = e.touches[0].clientY;
              state.originTx = state.tx;
              state.originTy = state.ty;
            }
          },
          { passive: false }
        );

        stage.addEventListener(
          "touchmove",
          function (e) {
            if (!state.open) return;
            if (state.pinching && e.touches.length === 2) {
              e.preventDefault();
              var dist = getTouchDist(e.touches);
              if (state.initialPinchDist > 0) {
                var ratio = dist / state.initialPinchDist;
                setZoom(state.initialPinchScale * ratio, false);
              }
            } else if (state.dragging && e.touches.length === 1 && state.scale > 1.02) {
              e.preventDefault();
              var dx = e.touches[0].clientX - state.startX;
              var dy = e.touches[0].clientY - state.startY;
              if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                state.dragMoved = true;
              }
              state.tx = state.originTx + dx;
              state.ty = state.originTy + dy;
              applyTransform(false);
            }
          },
          { passive: false }
        );

        stage.addEventListener("touchend", function (e) {
          if (!state.open) return;
          if (e.touches.length < 2) {
            state.pinching = false;
          }
          if (e.touches.length === 0) {
            state.dragging = false;
            if (state.dragMoved) {
              setTimeout(function () {
                state.dragMoved = false;
              }, 60);
            }
            applyTransform(true);
          }
        });

        // Global Delegated Click Listener on ANY Content <img> across Challenge 1, 2, 3, Presenter & Sandbox
        document.addEventListener(
          "click",
          function (e) {
            if (state.open) return;
            var target = e.target;
            if (!target || target.tagName !== "IMG") return;
            if (target.getAttribute("data-no-zoom") === "true") return;
            if (overlay.contains(target)) return;

            var explicitZoom = target.getAttribute("data-zoomable") === "true";
            if (!explicitZoom) {
              if (target.closest("button, a, [role='button']")) return;
              var rect = target.getBoundingClientRect();
              var w = rect.width || target.naturalWidth || target.width || 0;
              var h = rect.height || target.naturalHeight || target.height || 0;
              if (w < 22 && h < 22) return;
            }

            var src = target.currentSrc || target.getAttribute("src") || target.src;
            if (!src) return;

            e.preventDefault();
            e.stopPropagation();
            window.openArenaImageZoom(src, target.alt || target.getAttribute("title") || "AI Arena Image");
          },
          true
        );
      })();
    </script>
  </body>
</html>
